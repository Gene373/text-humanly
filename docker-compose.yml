services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-text_app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?укажите POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-text_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: ${APP_URL:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-text_app}
      SESSION_SECRET: ${SESSION_SECRET:?укажите SESSION_SECRET в .env}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      MAGIC_LINK_TTL_MINUTES: ${MAGIC_LINK_TTL_MINUTES:-15}
      DAILY_LIMIT: ${DAILY_LIMIT:-3}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-10000}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://api.giga.chat/v1}
      GIGACHAT_OAUTH_URL: ${GIGACHAT_OAUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      GIGACHAT_TIMEOUT_MS: ${GIGACHAT_TIMEOUT_MS:-60000}
      GIGACHAT_USER_AGENT: ${GIGACHAT_USER_AGENT:-text-humanly/1.0}
      GIGACHAT_CA_CERT_PATH: ${GIGACHAT_CA_CERT_PATH:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: "${SMTP_FROM:-Текст по-человечески <no-reply@example.com>}"
      OCR_LANG: ${OCR_LANG:-rus}
      VK_BOT_ENABLED: ${VK_BOT_ENABLED:-true}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-0}
      VK_NOTIFY_PEER_ID: ${VK_NOTIFY_PEER_ID:-0}
      VK_ADMIN_IDS: ${VK_ADMIN_IDS:-}
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - server

volumes:
  pgdata:
